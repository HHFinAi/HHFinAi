<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">Sustainable Finance AI</title>
<desc id="desc">Connecting climate, capital and fundamental research. Sources &gt; scenarios &gt; valuation &gt; judgment. Decorative animated squares, not contribution statistics.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c2d"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="rule"><stop stop-color="#3fb950"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient>
  <pattern id="matrix" x="805" y="48" width="81" height="81" patternUnits="userSpaceOnUse">
    <g fill="#3fb950">
      <rect width="17" height="17" rx="4" opacity=".16"/><rect x="27" width="17" height="17" rx="4" opacity=".42"/><rect x="54" width="17" height="17" rx="4" opacity=".68"/>
      <rect y="27" width="17" height="17" rx="4" opacity=".42"/><rect x="27" y="27" width="17" height="17" rx="4" opacity=".09"/><rect x="54" y="27" width="17" height="17" rx="4" opacity=".25"/>
      <rect y="54" width="17" height="17" rx="4" opacity=".68"/><rect x="27" y="54" width="17" height="17" rx="4" opacity=".25"/><rect x="54" y="54" width="17" height="17" rx="4" opacity=".42"/>
    </g>
  </pattern>
  <clipPath id="reveal"><rect id="reveal-rect" x="73" y="211" width="616" height="28"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .eyebrow { fill: #aff5b4; font-size: 12px; letter-spacing: 1.6px; font-weight: 600; }
  .title { fill: #f0f6fc; font-size: 40px; font-weight: 700; letter-spacing: -1.6px; }
  .sub { fill: #b1bac4; font-size: 18px; }
  .terminal { fill: #aff5b4; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 19px; }
  .tag { fill: #d0d7de; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; letter-spacing: .4px; }
  .node { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; letter-spacing: .7px; }
  #reveal-rect { animation: type 9s steps(48,end) infinite; }
  .cursor { animation: blink 1s step-end infinite; }
  .scan { animation: scan 7s ease-in-out infinite alternate; }
  @keyframes type { 0%,14% { width: 616px; } 22% { width: 0px; } 76%,100% { width: 616px; } }
  @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
  @keyframes scan { from { transform: translateY(0); opacity:.25; } to { transform: translateY(158px); opacity:.75; } }
  @media (prefers-reduced-motion: reduce) { #reveal-rect { animation: none; width:616px; } .cursor,.scan { animation:none; } }
</style>
<rect x="1" y="1" width="1098" height="328" rx="20" fill="url(#bg)" stroke="#30363d"/>
<rect x="52" y="41" width="30" height="3" rx="1.5" fill="#3fb950"/>
<text x="52" y="70" class="eyebrow">SUSTAINABLE FINANCE  /  FUNDAMENTAL RESEARCH  /  AI</text>
<text x="49" y="133" class="title">Sustainable Finance AI</text>
<text x="52" y="170" class="sub">Connecting climate, capital and fundamental research.</text>
<path d="M52 191 H700" stroke="url(#rule)"/>
<text x="52" y="232" class="terminal">&gt;</text>
<text x="73" y="232" class="terminal" clip-path="url(#reveal)">Sources &gt; scenarios &gt; valuation &gt; judgment</text>
<rect x="52" y="265" width="186" height="32" rx="16" fill="#161f2c" stroke="#303d4e"/><text x="145.0" y="286" class="tag" text-anchor="middle">CLIMATE INVESTING</text>
<rect x="248" y="265" width="166" height="32" rx="16" fill="#161f2c" stroke="#303d4e"/><text x="331.0" y="286" class="tag" text-anchor="middle">EQUITY + CREDIT</text>
<rect x="424" y="265" width="160" height="32" rx="16" fill="#161f2c" stroke="#303d4e"/><text x="504.0" y="286" class="tag" text-anchor="middle">HUMAN REVIEW</text>

<path d="M747 48 V299" stroke="#253143"/>
<rect x="805" y="48" width="243" height="189" fill="url(#matrix)"/>
<rect class="scan" x="800" y="47" width="243" height="3" rx="1.5" fill="#aff5b4"/>
<path d="M773 268 H983" stroke="#405064" stroke-width="2"/>
<circle cx="773" cy="268" r="5" fill="#3fb950"/><text x="773" y="294" class="node" text-anchor="middle">SOURCES</text><circle cx="843" cy="268" r="5" fill="#3fb950"/><text x="843" y="294" class="node" text-anchor="middle">SCENARIOS</text><circle cx="913" cy="268" r="5" fill="#3fb950"/><text x="913" y="294" class="node" text-anchor="middle">MODELS</text><circle cx="983" cy="268" r="5" fill="#3fb950"/><text x="983" y="294" class="node" text-anchor="middle">REVIEW</text>
</svg>